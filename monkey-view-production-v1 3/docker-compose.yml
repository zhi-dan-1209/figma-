services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      PUBLIC_BASE_URL: "https://${DOMAIN}"
      SESSION_TTL_MINUTES: "${SESSION_TTL_MINUTES:-120}"
      MAX_SESSIONS: "${MAX_SESSIONS:-1000}"
      MAX_IMAGE_MB: "${MAX_IMAGE_MB:-12}"
    networks:
      - preview

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: "${DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - preview

networks:
  preview:

volumes:
  caddy_data:
  caddy_config:
